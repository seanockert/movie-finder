<title>Movie Finder with Jev</title>
<link rel="stylesheet" href="/style.css">
<script>
// The banner reports faults in this page only. A script from another origin —
// a Safari extension on iOS, for example — reaches this handler as the muted
// report ("Script error.", no file, line 0). It names nothing and belongs to
// nobody here, so drop it. A real fault in our own code keeps its file and line.
addEventListener('error', function (e) {
  var el = document.getElementById('fatal');
  if (!el) return;
  var src = e.target && e.target.src;
  if (src) {
    if (new URL(src, location.href).origin !== location.origin) return;
    el.textContent = 'Failed to load ' + src;
  } else {
    if (!e.filename) return;
    el.textContent = (e.message || String(e.error)) + '\n' + e.filename + ':' + e.lineno;
  }
  el.hidden = false;
}, true);
</script>
</head>
<body>
<pre id="fatal" hidden></pre>

<div id="stage">
  <div id="pile" aria-hidden="true"></div>

  <div id="top">
    <form id="form" autocomplete="off" role="search">
      <input id="q" placeholder="" maxlength="200" spellcheck="false" autofocus>
      <button id="clear" type="button" title="Clear" hidden>&times;</button>
    </form>

    <div id="results"></div>
    <p id="status"></p>
  </div>

  <button id="toggle" type="button" title="What Jev returned">?</button>
</div>

<aside id="panel" hidden>
  <header>
    <h2>What Jev returned</h2>
    <button id="close" type="button">&times;</button>
  </header>
  <div id="panelBody"><p class="note">Type a request. Two Jev requests answer it.</p></div>
</aside>

<script src="/matter.js"></script>
<script type="module" src="/main.js"></script>
</body>
</html>
